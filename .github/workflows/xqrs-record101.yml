name: WFDB XQRS record 101 validation

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "scripts/xqrs_record101_check.py"
      - ".github/workflows/xqrs-record101.yml"
  workflow_dispatch:

jobs:
  xqrs-record101:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detector dependencies used by the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install "wfdb==4.3.0" "numpy>=1.26,<2.2" "scipy>=1.13,<2" "pandas>=2.2,<3"
      - name: Download MIT-BIH record 101
        run: |
          mkdir -p record101
          for ext in hea dat atr; do
            curl --fail --location --silent --show-error \
              "https://physionet.org/files/mitdb/1.0.0/101.$ext" \
              --output "record101/101.$ext"
          done
      - name: Run XQRS and compare to reference annotations
        run: python scripts/xqrs_record101_check.py record101/101
